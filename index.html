<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <meta http-equiv="refresh" content="3;url=https://burmeseplay.com/">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #ffffff;
            display: grid;
            place-items: center;
        }
        .center-container {
            text-align: center;
        }
        .loading-text {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .redirect-button {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 1em;
            border-radius: 8px;
            display: inline-block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="center-container">
        <div class="spinner"></div>
        <div class="loading-text">Loading...</div>
        <a href="https://burmeseplay.com/" class="redirect-button">လင့်ခ်အသစ်ဆီသို့ သွားရန် နှိပ်ပါ</a>
    </div>
</body>
</html>
